<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Month of Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage">
  <div class="badge">
    <strong>1st</strong>
    <span>month</span>
  </div>

  <h1>It's been a whole month of us.</h1>
  <p class="sub">Small as a month sounds, this is to show I'll always celebrate every milestone nomatter how small. Do you want to see the love letter I wrote you 🥹?</p>

  <div class="choice-row" id="choiceRow">
    <button class="yes-btn" id="yesBtn">Yes, show me</button>
    <button class="no-btn" id="noBtn">Not yet</button>
  </div>

  <p class="hint">(fair warning, "not yet" is a little shy)</p>
</main>

<!-- Background song: starts on the first tap/click/keypress anywhere on the page -->
<audio id="bgMusic" src="Justin_Bieber-Everything_Hallelujah.mp3" loop preload="auto"></audio>
  

<script src="script.js"></script>

<script>
  (function () {
    var audio = document.getElementById('bgMusic');
    var started = false;

    function startMusic() {
      if (started) return;
      started = true;
      audio.volume = 0.6;
      audio.play().catch(function () {
        // If the browser still blocks it, try again on the next interaction.
        started = false;
      });
      document.removeEventListener('click', startMusic);
      document.removeEventListener('touchstart', startMusic);
      document.removeEventListener('keydown', startMusic);
    }

    document.addEventListener('click', startMusic);
    document.addEventListener('touchstart', startMusic);
    document.addEventListener('keydown', startMusic);
  })()
    
    window.addEventListener('beforeunload', function () {
    sessionStorage.setItem('bgMusicTime', audio.currentTime);
    sessionStorage.setItem('bgMusicPlaying', started ? '1' : '0');
  });
</script>  
</body>
</html>
